# Constrói a imagem linux/amd64 e publica no GitHub Container Registry (GHCR) a
# cada push no main. Usa o GITHUB_TOKEN automático — nenhum segredo a configurar.
# A imagem fica em ghcr.io/<dono>/gamerfy-music-bot:latest, pronta para o Bunny.
name: Publish image
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
